<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tokens.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="screens-1.jsx"></script>
<script type="text/babel" src="screens-2.jsx"></script>
<script type="text/babel" src="screens-3.jsx"></script>
<script type="text/babel" src="screens-4.jsx"></script>

<script type="text/babel">
function App() {
  return (
    <DesignCanvas title="Safe Pakistan — App Design"
      subtitle="Pakistan's AI Scam Guardian · 15 screens + states · v1.1">

      <DCSection id="onboarding" title="Onboarding" subtitle="First-run, language select, threat intro">
        <DCArtboard id="welcome" label="01 · Welcome (slide 1)" width={390} height={844}>
          <WelcomeScreen/>
        </DCArtboard>
        <DCArtboard id="ob-threats" label="02 · Onboarding · Threats" width={390} height={844}>
          <OnboardingThreats/>
        </DCArtboard>
      </DCSection>

      <DCSection id="core" title="Core Flow" subtitle="Dashboard, scan, verdict — the heart of the app">
        <DCArtboard id="home" label="03 · Home / Dashboard" width={390} height={844}>
          <HomeScreen/>
        </DCArtboard>
        <DCArtboard id="scan" label="04 · Scan Input" width={390} height={844}>
          <ScanScreen/>
        </DCArtboard>
        <DCArtboard id="loading" label="05 · Analyzing (loading)" width={390} height={844}>
          <ScanLoadingScreen/>
        </DCArtboard>
        <DCArtboard id="verdict-scam" label="06 · Verdict · SCAM" width={390} height={844}>
          <VerdictScamScreen/>
        </DCArtboard>
        <DCArtboard id="verdict-safe" label="07 · Verdict · SAFE" width={390} height={844}>
          <VerdictSafeScreen/>
        </DCArtboard>
        <DCArtboard id="screenshot-result" label="13 · Screenshot Result" width={390} height={844}>
          <ScreenshotResultScreen/>
        </DCArtboard>
      </DCSection>

      <DCSection id="voice" title="Voice Agent" subtitle="Hands-free guardian in 3 languages">
        <DCArtboard id="voice" label="08 · Voice (listening)" width={390} height={844}>
          <VoiceScreen/>
        </DCArtboard>
      </DCSection>

      <DCSection id="family" title="Family & History" subtitle="Shared protection + searchable threat log">
        <DCArtboard id="family" label="09 · Family Shield" width={390} height={844}>
          <FamilyScreen/>
        </DCArtboard>
        <DCArtboard id="library" label="10 · Threat Library" width={390} height={844}>
          <LibraryScreen/>
        </DCArtboard>
        <DCArtboard id="family-consent" label="14 · Family Invite Consent" width={390} height={844}>
          <FamilyConsentScreen/>
        </DCArtboard>
      </DCSection>

      <DCSection id="insights" title="Insights & Chat" subtitle="Weekly report + ask anything to Guardian">
        <DCArtboard id="analytics" label="11 · Analytics / Report" width={390} height={844}>
          <AnalyticsScreen/>
        </DCArtboard>
        <DCArtboard id="chat" label="12 · Guardian Chat" width={390} height={844}>
          <ChatScreen/>
        </DCArtboard>
        <DCArtboard id="model-perf" label="15 · Model Performance" width={390} height={844}>
          <ModelPerfScreen/>
        </DCArtboard>
      </DCSection>

    </DesignCanvas>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
